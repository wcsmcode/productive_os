<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <!-- 1. KHỐI NỀN MÀU VÀNG CÁT VỚI VIỀN ĐEN DÀY BỌC THÉP -->
  <rect x="4" y="4" width="56" height="56" fill="#E6D5BC" stroke="#000000" stroke-width="5" />

  <!-- 2. LOGO CHỮ P HÌNH HỌC PHẲNG - KHÔNG THỂ NHẦM LẪN -->
  <g fill="#000000">
    <!-- Nét dọc chính và đỉnh đầu vuông góc: Tạo thành hình góc vuông 90 độ rõ rệt -->
    <!-- Chạy từ X=24 kéo sang X=44 ở đỉnh, và chạy dọc xuống Y=48 ở chân -->
    <path d="M24 16H44V22H30V48H24V16Z" />
    
    <!-- Phần bụng dưới lơ lửng: Chữ nhật ngang sắc lẹm, hở hẳn một khoảng so với thân dọc -->
    <!-- Điểm bắt đầu từ X=34, tạo khoảng trống 4px so với thân dọc (X=30) -->
    <rect x="34" y="30" width="10" height="6" />
    
    <!-- Nét đóng dọc phía bên phải của bụng chữ P để định hình rõ khối vuông -->
    <rect x="38" y="22" width="6" height="14" />

    <!-- 3. DẤU CHẤM HỆ THỐNG (Dot Node) vuông vức ở góc phải -->
    <rect x="44" y="44" width="5" height="5" />
  </g>
</svg>
